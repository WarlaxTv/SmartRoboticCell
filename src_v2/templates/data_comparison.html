<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Données - Supervision NF EN 9100</title>
    <link rel="stylesheet" href="{{ static_v('theme.css') }}">
    <script src="{{ static_v('chart.umd.js') }}"></script>
    <style>
        .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
        canvas { max-height: 280px; }
        .card h2 { margin: 0 0 16px 0; font-size: 1em; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { background: var(--panel); color: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 16px; font-size: 0.9em; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .download-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .download-row:last-child { border-bottom: none; }
        .download-row .download-label { font-size: 0.9em; color: var(--ink); }
    </style>
</head>
<body>
    <div id="topnav-root"></div>

    <div id="access-denied" class="access-denied-box hidden">
        <h2 id="access-denied-title">Accès réservé</h2>
        <p id="access-denied-body">Cette page est réservée au rôle MAINTENANCE.</p>
        <a href="/" class="btn" id="access-denied-back">Retour au dashboard</a>
    </div>

    <main id="page-content" class="hidden">
        <div class="header">
            <h1 id="page-title">Données par cellule</h1>
        </div>

        <div class="tab-bar">
            <button type="button" class="tab-btn active" id="tab-btn-charts" onclick="showTab('charts')">Courbes</button>
            <button type="button" class="tab-btn" id="tab-btn-download" onclick="showTab('download')">Télécharger</button>
        </div>

        <div id="tab-charts">
            <div class="filter-bar">
                <label for="range-select" id="range-label" style="font-size:0.85em; color:#6E6E73; font-weight:600;">Période :</label>
                <select id="range-select" class="range-select" onchange="loadAll()">
                    <option value="24">24 heures</option>
                    <option value="168">7 jours</option>
                    <option value="720">30 jours</option>
                </select>
            </div>

            <!-- Une section par cellule (cf. demande utilisateur : "je ne veux
                 pas d'un graphique avec les 3 cellules. Je veux les cellules
                 indépendantes"), construite dynamiquement par loadAll() ->
                 cellSectionHtml(), sur le même principe que les cartes du
                 dashboard principal. -->
            <div id="per-cell-charts"></div>
        </div>

        <div id="tab-download" class="hidden">
            <div class="card">
                <h2><span id="title-download-cells">Données brutes par cellule (tous les axes)</span></h2>
                <div id="download-cells-list"></div>
            </div>
        </div>
    </main>

    <script src="{{ static_v('common.js') }}"></script>
    <script>
        const I18N = {
            fr: {
                pageTitle: "Données par cellule",
                tabCharts: "Courbes",
                tabDownload: "Télécharger",
                periodLabel: "Période :",
                rangeDay: "24 heures", rangeWeek: "7 jours", rangeMonth: "30 jours",
                titleTemp: "Température par axe (°C)",
                titleCourant: "Courant par axe (A)",
                titleCouple: "Couple par axe (N·m)",
                titlePressure: "Pression pneumatique (bar)",
                titleLubrix: "Niveau lubrifiant (%)",
                axisWord: "Axe",
                cellLabel: "Cellule",
                titleDownloadCells: "Données brutes par cellule",
                downloadBtn: "Télécharger CSV",
                csvTime: "Horodatage",
                csvAxis: "Axe",
                cellRawLabel: "toutes les données (6 axes, pression, lubrifiant)",
                csvTempLabel: "Température (°C)",
                csvCourantLabel: "Courant (A)",
                csvCoupleLabel: "Couple (N·m)",
                csvPressureLabel: "Pression pneumatique (bar)",
                csvLubrixLabel: "Niveau lubrifiant (%)",
            },
            en: {
                pageTitle: "Data by cell",
                tabCharts: "Charts",
                tabDownload: "Download",
                periodLabel: "Period:",
                rangeDay: "24 hours", rangeWeek: "7 days", rangeMonth: "30 days",
                titleTemp: "Temperature per axis (°C)",
                titleCourant: "Current per axis (A)",
                titleCouple: "Torque per axis (N·m)",
                titlePressure: "Pneumatic pressure (bar)",
                titleLubrix: "Lubricant level (%)",
                axisWord: "Axis",
                cellLabel: "Cell",
                titleDownloadCells: "Raw data per cell",
                downloadBtn: "Download CSV",
                csvTime: "Timestamp",
                csvAxis: "Axis",
                cellRawLabel: "all data (6 axes, pressure, lubricant)",
                csvTempLabel: "Temperature (°C)",
                csvCourantLabel: "Current (A)",
                csvCoupleLabel: "Torque (N·m)",
                csvPressureLabel: "Pneumatic pressure (bar)",
                csvLubrixLabel: "Lubricant level (%)",
            },
        };

        const token = localStorage.getItem('jwt_token');
        const currentRole = localStorage.getItem('user_role');
        // Peuplée depuis CELL_LIST (common.js::loadCellNames()) avant tout
        // rendu : cette page n'est plus limitée à 3 cellules fixes depuis que
        // l'Administrateur peut en créer de nouvelles (cf. CHG-V2-088).
        let CELLS = [];
        const CELL_COLORS = ['#0071E3', '#34C759', '#FF9500', '#FF3B30', '#5E5CE6', '#AF52DE'];
        // Mêmes couleurs que cell_detail.html pour la cohérence visuelle
        // d'un axe donné d'une page à l'autre.
        const AXIS_COLORS = ['#0071E3', '#34C759', '#FF9500', '#FF3B30', '#5E5CE6', '#AF52DE'];

        function t(key) {
            const lang = navLang();
            return (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
        }

        function applyLanguage() {
            document.title = t('pageTitle');
            document.getElementById('page-title').innerText = t('pageTitle');
            document.getElementById('tab-btn-charts').innerText = t('tabCharts');
            document.getElementById('tab-btn-download').innerText = t('tabDownload');
            document.getElementById('range-label').innerText = t('periodLabel');
            const opts = document.getElementById('range-select').options;
            opts[0].innerText = t('rangeDay');
            opts[1].innerText = t('rangeWeek');
            opts[2].innerText = t('rangeMonth');
            // Les titres des cartes de courbes (title-temp/courant/...) ne
            // sont plus des éléments statiques : chaque section de cellule
            // est reconstruite par loadAll() -> cellSectionHtml(), déjà avec
            // t() appliqué au moment de la génération. Un changement de
            // langue recharge de toute façon la page entière (cf.
            // toggleNavLanguage() dans common.js), donc pas besoin de les
            // retraduire ici.
            document.getElementById('title-download-cells').innerText = t('titleDownloadCells');
            document.getElementById('access-denied-title').innerText = navT('accessDeniedTitle');
            document.getElementById('access-denied-body').innerText = navT('accessDeniedBody');
            document.getElementById('access-denied-back').innerText = navT('accessDeniedBack');
            renderTopNav('data', currentRole);
            renderDownloadTab();
        }

        function showTab(tab) {
            document.getElementById('tab-charts').classList.toggle('hidden', tab !== 'charts');
            document.getElementById('tab-download').classList.toggle('hidden', tab !== 'download');
            document.getElementById('tab-btn-charts').classList.toggle('active', tab === 'charts');
            document.getElementById('tab-btn-download').classList.toggle('active', tab === 'download');
        }

        async function fetchCellMeasures(cellId, hours) {
            try {
                const resp = await fetch(`/api/cell/${cellId}/measures?hours=${hours}`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                if (!resp.ok) return { axis_measures: [], cell_measures: [] };
                return await resp.json();
            } catch (e) {
                console.error(e);
                return { axis_measures: [], cell_measures: [] };
            }
        }

        // Un jeu de données par axe (6 lignes), PAS moyenné entre les axes —
        // cf. demande utilisateur ("pour la température des axes, il faut
        // que ce soit chaque axe séparément", étendue ensuite à "je veux que
        // la consommation et le couple soient également par axe"). `field`
        // vaut 'temperature_c', 'courant_a' ou 'couple_nm'. Toujours les 6
        // axes (cette page n'a pas de sélecteur d'axes comme cell_detail.html).
        // Retourne { datasets, labels } : les 6 axes sont écrits en base par
        // des INSERT distincts au même tick et peuvent différer d'1s l'un de
        // l'autre à l'occasion, d'où la liste de catégories fusionnée et
        // triée explicite (même raison que buildAxisDatasets dans
        // cell_detail.html, cf. CHG-V2-086).
        function buildAxisDatasetsForCell(axisMeasures, field) {
            const byAxis = {};
            for (const m of axisMeasures) {
                if (!byAxis[m.axe]) byAxis[m.axe] = [];
                byAxis[m.axe].push(m);
            }
            const decimatedByAxis = {};
            for (const axe of Object.keys(byAxis)) {
                decimatedByAxis[axe] = decimateSeries(byAxis[axe], 'time', [field], CHART_MAX_POINTS);
            }
            const labels = mergedSortedTimes(Object.values(decimatedByAxis));
            const datasets = Object.keys(byAxis).sort((a, b) => a - b).map((axe) => ({
                label: `${t('axisWord')} ${axe}`,
                data: decimatedByAxis[axe].map((m) => ({ x: m.time, y: m[field] })),
                borderColor: AXIS_COLORS[(axe - 1) % AXIS_COLORS.length],
                backgroundColor: 'transparent',
                tension: 0.25,
                pointRadius: 0,
            }));
            return { datasets, labels };
        }

        // Génère la section de courbes d'une cellule (5 cartes : température
        // par axe, courant moyen, couple moyen, pression, lubrifiant) —
        // reconstruite à chaque loadAll() comme les cartes du dashboard
        // principal. Le bouton de téléchargement d'image n'est inclus dans
        // le HTML que pour la Maintenance (plutôt que masqué après coup) :
        // les cartes étant reconstruites dynamiquement, un passage de
        // masquage exécuté avant loadAll() n'aurait plus rien à masquer.
        function cellSectionHtml(cellId) {
            const dlBtn = (key) => hasMaintenanceRights(currentRole)
                ? `<button type="button" class="chart-zoom-btn chart-dl-btn" onclick="downloadChart('${key}')" title="Télécharger l'image">&#8681;</button>`
                : '';
            const card = (key, title, canvasId) => `
                <div class="card">
                    <h2><span>${title}</span> <span>${dlBtn(key)}<button type="button" class="chart-zoom-btn" onclick="zoomChart('${key}')" title="Agrandir">⤢</button></span></h2>
                    <canvas id="${canvasId}"></canvas>
                </div>
            `;
            return `
                <h3 style="margin: 24px 0 12px 0; font-size:1.05em; font-weight:600; color:var(--ink);">${cellDisplayName(cellId)}</h3>
                <div class="grid2">
                    ${card(`temp-${cellId}`, t('titleTemp'), `chart-temp-${cellId}`)}
                    ${card(`courant-${cellId}`, t('titleCourant'), `chart-courant-${cellId}`)}
                    ${card(`couple-${cellId}`, t('titleCouple'), `chart-couple-${cellId}`)}
                    ${card(`pressure-${cellId}`, t('titlePressure'), `chart-pressure-${cellId}`)}
                    ${card(`lubrix-${cellId}`, t('titleLubrix'), `chart-lubrix-${cellId}`)}
                </div>
            `;
        }

        let charts = {};
        // Dernier jeu de données/label de chaque graphique, pour pouvoir
        // reconstruire une version agrandie identique (voir zoomChart()) —
        // même principe que cell_detail.html, mais avec des labels fusionnés
        // explicites (voir mergedSortedTimes ci-dessous).
        const chartRegistry = {};
        // Dernières données chargées, réutilisées par les téléchargements CSV
        // (onglet "Télécharger") sans refaire d'appel réseau.
        let lastLoadedData = null;
        // Nombre max de points bruts affichés par série avant moyennage (cf.
        // decimateSeries dans common.js et son explication détaillée dans
        // cell_detail.html) : évite les courbes illisibles sur une fenêtre
        // 24h/7j/30j et dilue les pics isolés dus à un redémarrage du
        // serveur OPC UA.
        const CHART_MAX_POINTS = 200;

        // mergedSortedTimes() est désormais partagée dans common.js (utilisée
        // aussi par cell_detail.html, cf. CHG-V2-086).

        function chartOptions(yLabel, extra = {}) {
            return {
                scales: {
                    x: { type: 'category', ticks: { maxTicksLimit: 8, autoSkip: true } },
                    y: { title: { display: true, text: yLabel } },
                },
                plugins: { legend: { position: 'bottom' } },
                animation: false,
                // Chaque cellule n'a de point qu'à SES propres horodatages :
                // sur l'axe fusionné, ses autres positions n'ont pas de
                // valeur. spanGaps relie quand même la ligne au travers de
                // ces trous plutôt que de la couper, pour un tracé lisible.
                spanGaps: true,
                ...extra,
            };
        }

        function lineChart(canvasId, labels, datasets, yLabel) {
            if (charts[canvasId]) charts[canvasId].destroy();
            // labels omis (undefined) sur les graphiques à un seul jeu de
            // données (pression/lubrifiant par cellule) : Chart.js retrouve
            // alors son comportement par défaut, toujours correct pour une
            // série unique. Fourni explicitement pour les courbes par axe
            // (température/courant/couple, plusieurs séries chacune, cf.
            // buildAxisDatasetsForCell).
            const data = labels ? { labels, datasets } : { datasets };
            charts[canvasId] = new Chart(document.getElementById(canvasId), {
                type: 'line',
                data,
                options: chartOptions(yLabel),
            });
        }

        // Options de la version agrandie d'une courbe (plein écran modal ET
        // image téléchargée doivent utiliser exactement les mêmes options,
        // cf. downloadChart ci-dessous).
        function buildZoomOptions(entry) {
            const options = chartOptions(entry.yLabel);
            options.maintainAspectRatio = false;
            options.scales.x.ticks.maxTicksLimit = 16;
            return options;
        }

        function zoomChart(key) {
            const entry = chartRegistry[key];
            if (!entry) return;
            // labels fournis explicitement (voir openChartZoom dans
            // common.js) pour ne pas réintroduire les sauts en arrière
            // (INC-V2-021) dans la version agrandie.
            openChartZoom(entry.title, entry.datasets, buildZoomOptions(entry), entry.labels);
        }

        // Télécharge l'image de la version AGRANDIE de la courbe (mêmes
        // options que zoomChart), pas la petite vignette en ligne — signalé
        // par l'utilisateur ("il faut que ce soit l'image de quand on
        // agrandit la courbe"). Réservé à la Maintenance (bouton masqué pour
        // l'Opérateur en bas de page, cf. RBAC round 6 : "ni télécharger les
        // graphs").
        function downloadChart(key) {
            const entry = chartRegistry[key];
            if (!entry) return;
            const safeTitle = entry.title.replace(/[^a-z0-9]+/gi, '_').toLowerCase();
            downloadZoomedChartImage(
                entry.datasets,
                buildZoomOptions(entry),
                entry.labels,
                `${safeTitle}.png`
            );
        }

        // Une section indépendante par cellule (cf. demande utilisateur :
        // "je ne veux pas d'un graphique avec les 3 cellules. Je veux les
        // cellules indépendantes"), reconstruite à chaque chargement/
        // changement de période, sur le même principe que les cartes du
        // dashboard principal (innerHTML régénéré, anciens graphiques
        // Chart.js détruits via lineChart()).
        async function loadAll() {
            const hours = document.getElementById('range-select').value;
            const perCell = await Promise.all(CELLS.map((id) => fetchCellMeasures(id, hours)));

            document.getElementById('per-cell-charts').innerHTML =
                CELLS.map((cellId) => cellSectionHtml(cellId)).join('');

            CELLS.forEach((cellId, i) => {
                const data = perCell[i];
                const color = CELL_COLORS[i % CELL_COLORS.length];

                const tempResult = buildAxisDatasetsForCell(data.axis_measures, 'temperature_c');
                const courantResult = buildAxisDatasetsForCell(data.axis_measures, 'courant_a');
                const coupleResult = buildAxisDatasetsForCell(data.axis_measures, 'couple_nm');
                const cellMeasures = decimateSeries(
                    data.cell_measures, 'time', ['pneumatic_pressure_bar', 'lubrix_level_pct'], CHART_MAX_POINTS
                );

                const pressureSet = [{ label: t('titlePressure'), data: cellMeasures.map((m) => ({ x: m.time, y: m.pneumatic_pressure_bar })), borderColor: color, backgroundColor: 'transparent', tension: 0.25, pointRadius: 0 }];
                const lubrixSet = [{ label: t('titleLubrix'), data: cellMeasures.map((m) => ({ x: m.time, y: m.lubrix_level_pct })), borderColor: color, backgroundColor: 'transparent', tension: 0.25, pointRadius: 0 }];

                lineChart(`chart-temp-${cellId}`, tempResult.labels, tempResult.datasets, '°C');
                lineChart(`chart-courant-${cellId}`, courantResult.labels, courantResult.datasets, 'A');
                lineChart(`chart-couple-${cellId}`, coupleResult.labels, coupleResult.datasets, 'N·m');
                lineChart(`chart-pressure-${cellId}`, undefined, pressureSet, 'bar');
                lineChart(`chart-lubrix-${cellId}`, undefined, lubrixSet, '%');

                const titleFor = (base) => `${base} — ${cellDisplayName(cellId)}`;
                chartRegistry[`temp-${cellId}`] = { title: titleFor(t('titleTemp')), datasets: tempResult.datasets, labels: tempResult.labels, yLabel: '°C' };
                chartRegistry[`courant-${cellId}`] = { title: titleFor(t('titleCourant')), datasets: courantResult.datasets, labels: courantResult.labels, yLabel: 'A' };
                chartRegistry[`couple-${cellId}`] = { title: titleFor(t('titleCouple')), datasets: coupleResult.datasets, labels: coupleResult.labels, yLabel: 'N·m' };
                chartRegistry[`pressure-${cellId}`] = { title: titleFor(t('titlePressure')), datasets: pressureSet, yLabel: 'bar' };
                chartRegistry[`lubrix-${cellId}`] = { title: titleFor(t('titleLubrix')), datasets: lubrixSet, yLabel: '%' };
            });

            lastLoadedData = { perCell };
            renderDownloadTab();
        }

        /* ---------- Export CSV (onglet "Télécharger") ----------
           toCsvValue()/downloadCsv() sont désormais partagées dans
           common.js (utilisées aussi par fault_history.html et
           maintenance_history.html). */

        // Export CSV cellule par cellule, format "large" (une ligne par
        // horodatage, une colonne par mesure) plutôt que le format
        // "comparatif des 3 cellules" retiré à la demande de l'utilisateur
        // round 6 ("je veux pouvoir télécharger cellule par cellule, pas un
        // comparatif des 3"). Corrige aussi le problème de rendu signalé
        // ("les téléchargements CSV rendent très mal niveau format") : la
        // version précédente répétait 6 lignes par horodatage (une par axe)
        // et omettait complètement la pression/le lubrifiant.
        function downloadCellCsv(cellId) {
            if (!lastLoadedData) return;
            const idx = CELLS.indexOf(cellId);
            const axisMeasures = lastLoadedData.perCell[idx].axis_measures;
            const cellMeasures = lastLoadedData.perCell[idx].cell_measures;

            const axisByTime = {};
            for (const m of axisMeasures) {
                if (!axisByTime[m.time]) axisByTime[m.time] = {};
                axisByTime[m.time][m.axe] = m;
            }
            const cellByTime = {};
            for (const m of cellMeasures) cellByTime[m.time] = m;

            const allTimes = mergedSortedTimes([axisMeasures, cellMeasures]);

            const header = [t('csvTime')];
            for (let axe = 1; axe <= 6; axe++) {
                header.push(
                    `${t('csvAxis')} ${axe} — ${t('csvTempLabel')}`,
                    `${t('csvAxis')} ${axe} — ${t('csvCourantLabel')}`,
                    `${t('csvAxis')} ${axe} — ${t('csvCoupleLabel')}`,
                );
            }
            header.push(t('csvPressureLabel'), t('csvLubrixLabel'));

            const rows = allTimes.map((time) => {
                const row = [time];
                for (let axe = 1; axe <= 6; axe++) {
                    const m = axisByTime[time] && axisByTime[time][axe];
                    row.push(m ? m.temperature_c : '', m ? m.courant_a : '', m ? m.couple_nm : '');
                }
                const cm = cellByTime[time];
                row.push(cm ? cm.pneumatic_pressure_bar : '', cm ? cm.lubrix_level_pct : '');
                return row;
            });

            downloadCsv(`cellule_${cellId}_donnees.csv`, header, rows);
        }

        function renderDownloadTab() {
            const cellsContainer = document.getElementById('download-cells-list');
            if (!cellsContainer) return;

            cellsContainer.innerHTML = CELLS.map((cellId) =>
                `<div class="download-row"><span class="download-label">${cellDisplayName(cellId)} — ${t('cellRawLabel')}</span><button class="btn" onclick="downloadCellCsv(${cellId})">${t('downloadBtn')}</button></div>`
            ).join('');
        }

        async function init() {
            if (!token) {
                window.location.href = '/';
            } else if (!hasPageAccess(currentRole)) {
                applyLanguage();
                document.getElementById('access-denied').classList.remove('hidden');
            } else {
                // Doit être chargé AVANT applyLanguage()/loadAll() : la liste
                // des cellules (CELL_LIST) alimente à la fois CELLS ci-dessous
                // et cellDisplayName() utilisé par applyLanguage() → aucun des
                // deux ne peut s'exécuter avec des données à jour tant que
                // cet appel n'est pas résolu.
                await loadCellNames();
                CELLS = CELL_LIST.map((c) => c.id);
                applyLanguage();
                // Courbes ouvertes en lecture à l'Opérateur (cf. décision
                // utilisateur round 6), mais tout téléchargement (CSV ou image
                // de courbe) reste réservé à la Maintenance : "la seule chose
                // que l'opérateur ne peut pas faire c'est créer des alertes, ni
                // télécharger les graphs". Les boutons de téléchargement d'image
                // ne sont plus masqués après coup ici : cellSectionHtml() ne les
                // génère désormais que pour hasMaintenanceRights(currentRole) (les
                // cartes de courbes étant reconstruites à chaque loadAll(), un
                // masquage exécuté une seule fois ici, avant leur création,
                // n'aurait plus rien à masquer).
                if (!hasMaintenanceRights(currentRole)) {
                    document.getElementById('tab-btn-download').classList.add('hidden');
                }
                document.getElementById('page-content').classList.remove('hidden');
                loadAll();
            }
        }

        init();
    </script>
</body>
</html>
