<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Données - Supervision NF EN 9100</title>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/chart.umd.js"></script>
    <style>
        .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
        canvas { max-height: 280px; }
    </style>
</head>
<body>
    <div id="topnav-root"></div>

    <div id="access-denied" class="access-denied-box hidden">
        <h2 id="access-denied-title">Accès réservé</h2>
        <p id="access-denied-body">Cette page est réservée au rôle MAINTENANCE.</p>
        <a href="/" class="btn" id="access-denied-back">Retour au dashboard</a>
    </div>

    <main id="page-content" class="hidden">
        <div class="header">
            <h1 id="page-title">Données — comparaison des 3 cellules</h1>
        </div>

        <div class="filter-bar">
            <label for="range-select" id="range-label" style="font-size:0.85em; color:#6E6E73; font-weight:600;">Période :</label>
            <select id="range-select" class="range-select" onchange="loadAll()">
                <option value="24">24 heures</option>
                <option value="168">7 jours</option>
                <option value="720">30 jours</option>
            </select>
        </div>

        <div class="grid2">
            <div class="card">
                <h2 id="title-temp">Température moyenne des axes (°C)</h2>
                <canvas id="chart-temp"></canvas>
            </div>
            <div class="card">
                <h2 id="title-courant">Courant moyen des axes (A)</h2>
                <canvas id="chart-courant"></canvas>
            </div>
            <div class="card">
                <h2 id="title-couple">Couple moyen des axes (N·m)</h2>
                <canvas id="chart-couple"></canvas>
            </div>
            <div class="card">
                <h2 id="title-pressure">Pression pneumatique (bar)</h2>
                <canvas id="chart-pressure"></canvas>
            </div>
            <div class="card">
                <h2 id="title-lubrix">Niveau lubrifiant (%)</h2>
                <canvas id="chart-lubrix"></canvas>
            </div>
        </div>
    </main>

    <script src="/static/common.js"></script>
    <script>
        const I18N = {
            fr: {
                pageTitle: "Données — comparaison des 3 cellules",
                periodLabel: "Période :",
                rangeDay: "24 heures", rangeWeek: "7 jours", rangeMonth: "30 jours",
                titleTemp: "Température moyenne des axes (°C)",
                titleCourant: "Courant moyen des axes (A)",
                titleCouple: "Couple moyen des axes (N·m)",
                titlePressure: "Pression pneumatique (bar)",
                titleLubrix: "Niveau lubrifiant (%)",
                cellLabel: "Cellule",
            },
            en: {
                pageTitle: "Data — 3-cell comparison",
                periodLabel: "Period:",
                rangeDay: "24 hours", rangeWeek: "7 days", rangeMonth: "30 days",
                titleTemp: "Average axis temperature (°C)",
                titleCourant: "Average axis current (A)",
                titleCouple: "Average axis torque (N·m)",
                titlePressure: "Pneumatic pressure (bar)",
                titleLubrix: "Lubricant level (%)",
                cellLabel: "Cell",
            },
        };

        const token = localStorage.getItem('jwt_token');
        const currentRole = localStorage.getItem('user_role');
        const CELLS = [1, 2, 3];
        const CELL_COLORS = ['#0071E3', '#34C759', '#FF9500'];

        function t(key) {
            const lang = navLang();
            return (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
        }

        function applyLanguage() {
            document.title = t('pageTitle');
            document.getElementById('page-title').innerText = t('pageTitle');
            document.getElementById('range-label').innerText = t('periodLabel');
            const opts = document.getElementById('range-select').options;
            opts[0].innerText = t('rangeDay');
            opts[1].innerText = t('rangeWeek');
            opts[2].innerText = t('rangeMonth');
            document.getElementById('title-temp').innerText = t('titleTemp');
            document.getElementById('title-courant').innerText = t('titleCourant');
            document.getElementById('title-couple').innerText = t('titleCouple');
            document.getElementById('title-pressure').innerText = t('titlePressure');
            document.getElementById('title-lubrix').innerText = t('titleLubrix');
            document.getElementById('access-denied-title').innerText = navT('accessDeniedTitle');
            document.getElementById('access-denied-body').innerText = navT('accessDeniedBody');
            document.getElementById('access-denied-back').innerText = navT('accessDeniedBack');
            renderTopNav('data', currentRole);
        }

        async function fetchCellMeasures(cellId, hours) {
            try {
                const resp = await fetch(`/api/cell/${cellId}/measures?hours=${hours}`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                if (!resp.ok) return { axis_measures: [], cell_measures: [] };
                return await resp.json();
            } catch (e) {
                console.error(e);
                return { axis_measures: [], cell_measures: [] };
            }
        }

        // Les relevés par axe sont détaillés (6 axes) ; pour comparer les 3
        // cellules entre elles sans surcharger les courbes de 18 lignes, on
        // calcule ici une moyenne par cellule et par horodatage (calcul
        // effectué côté client, à partir des mêmes relevés que la page de
        // détail d'une cellule).
        function averageAxesByTime(axisMeasures) {
            const byTime = {};
            for (const m of axisMeasures) {
                if (!byTime[m.time]) byTime[m.time] = { temp: [], courant: [], couple: [] };
                byTime[m.time].temp.push(m.temperature_c);
                byTime[m.time].courant.push(m.courant_a);
                byTime[m.time].couple.push(m.couple_nm);
            }
            const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
            return Object.keys(byTime).sort().map((time) => ({
                time,
                temperature_c: avg(byTime[time].temp),
                courant_a: avg(byTime[time].courant),
                couple_nm: avg(byTime[time].couple),
            }));
        }

        let charts = {};

        function lineChart(canvasId, datasets, yLabel) {
            if (charts[canvasId]) charts[canvasId].destroy();
            charts[canvasId] = new Chart(document.getElementById(canvasId), {
                type: 'line',
                data: { datasets },
                options: {
                    scales: {
                        x: { type: 'category', ticks: { maxTicksLimit: 8, autoSkip: true } },
                        y: { title: { display: true, text: yLabel } },
                    },
                    plugins: { legend: { position: 'bottom' } },
                    animation: false,
                },
            });
        }

        async function loadAll() {
            const hours = document.getElementById('range-select').value;
            const perCell = await Promise.all(CELLS.map((id) => fetchCellMeasures(id, hours)));

            const tempSets = [], courantSets = [], coupleSets = [], pressureSets = [], lubrixSets = [];

            CELLS.forEach((cellId, i) => {
                const data = perCell[i];
                const color = CELL_COLORS[i];
                const label = `${t('cellLabel')} ${cellId}`;
                const avg = averageAxesByTime(data.axis_measures);

                tempSets.push({ label, data: avg.map(m => ({ x: m.time, y: m.temperature_c })), borderColor: color, backgroundColor: 'transparent', tension: 0.25, pointRadius: 0 });
                courantSets.push({ label, data: avg.map(m => ({ x: m.time, y: m.courant_a })), borderColor: color, backgroundColor: 'transparent', tension: 0.25, pointRadius: 0 });
                coupleSets.push({ label, data: avg.map(m => ({ x: m.time, y: m.couple_nm })), borderColor: color, backgroundColor: 'transparent', tension: 0.25, pointRadius: 0 });
                pressureSets.push({ label, data: data.cell_measures.map(m => ({ x: m.time, y: m.pneumatic_pressure_bar })), borderColor: color, backgroundColor: 'transparent', tension: 0.25, pointRadius: 0 });
                lubrixSets.push({ label, data: data.cell_measures.map(m => ({ x: m.time, y: m.lubrix_level_pct })), borderColor: color, backgroundColor: 'transparent', tension: 0.25, pointRadius: 0 });
            });

            lineChart('chart-temp', tempSets, '°C');
            lineChart('chart-courant', courantSets, 'A');
            lineChart('chart-couple', coupleSets, 'N·m');
            lineChart('chart-pressure', pressureSets, 'bar');
            lineChart('chart-lubrix', lubrixSets, '%');
        }

        if (!token) {
            window.location.href = '/';
        } else if (currentRole !== 'MAINTENANCE') {
            applyLanguage();
            document.getElementById('access-denied').classList.remove('hidden');
        } else {
            applyLanguage();
            document.getElementById('page-content').classList.remove('hidden');
            loadAll();
        }
    </script>
</body>
</html>
