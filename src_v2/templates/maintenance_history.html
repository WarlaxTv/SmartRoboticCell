<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Historique Maintenance - Supervision NF EN 9100</title>
    <link rel="stylesheet" href="{{ static_v('theme.css') }}">
</head>
<body>
    <div id="topnav-root"></div>

    <div id="access-denied" class="access-denied-box hidden">
        <h2 id="access-denied-title">Accès réservé</h2>
        <p id="access-denied-body">Cette page est réservée au rôle MAINTENANCE.</p>
        <a href="/" class="btn" id="access-denied-back">Retour au dashboard</a>
    </div>

    <main id="page-content" class="hidden">
        <div class="header">
            <h1 id="page-title">Historique des interventions Maintenance</h1>
        </div>

        <div class="filter-bar">
            <div class="filter-bar-group">
                <label for="cell-filter" class="filter-bar-label" id="filter-cell-label">Cellule :</label>
                <select id="cell-filter" onchange="fetchAll()">
                    <option value="">Toutes</option>
                </select>
            </div>
            <div class="filter-bar-group">
                <label for="since-filter" class="filter-bar-label" id="filter-since-label">Du :</label>
                <input type="date" id="since-filter" class="filter-input" onchange="fetchAll()">
            </div>
            <div class="filter-bar-group">
                <label for="until-filter" class="filter-bar-label" id="filter-until-label">Au :</label>
                <input type="date" id="until-filter" class="filter-input" onchange="fetchAll()">
            </div>
            <button class="btn btn-reset" id="filter-reset-btn" onclick="resetFilters()">Réinitialiser</button>
            <button class="btn hidden" id="download-csv-btn" onclick="downloadMaintenanceCsv()">Télécharger CSV</button>
        </div>

        <div class="pending-panel" id="pending-panel">
            <div class="pending-toggle-row">
                <label>
                    <input type="checkbox" id="pending-toggle" checked onchange="togglePendingVisibility()">
                    <span id="pending-toggle-label">Afficher aussi les demandes d'intervention en attente</span>
                </label>
            </div>
            <div id="pending-block">
                <h3 id="pending-title" style="margin:0 0 8px 0; font-size:1em; color:#1D1D1F;">Demandes en attente</h3>
                <div class="history-panel">
                    <div id="pending-content">
                        <p style="color:#6E6E73;" id="pending-loading-label">Chargement...</p>
                    </div>
                </div>
                <h3 id="generic-pending-title" style="margin:14px 0 8px 0; font-size:1em; color:#1D1D1F;">Demandes génériques</h3>
                <div class="history-panel">
                    <div id="generic-pending-content">
                        <p style="color:#6E6E73;" id="generic-pending-loading-label">Chargement...</p>
                    </div>
                </div>
            </div>
        </div>

        <h3 id="history-title" style="margin:0 0 8px 0; font-size:1em; color:#1D1D1F;">Interventions réalisées</h3>
        <div class="history-panel">
            <div id="history-content">
                <p style="color:#6E6E73;" id="loading-label">Chargement de l'historique...</p>
            </div>
        </div>
    </main>

    <!-- Popup "Prise en charge d'une demande générique" (rôle MAINTENANCE
         uniquement) : même structure (résultat résolu/en cours + notes) que
         la popup d'intervention sur un défaut de fault_history.html, pour
         que le suivi d'une demande générique se comporte "comme pour les
         défauts avec (en cours, ou résolu)" (demande utilisateur). -->
    <div id="ack-modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span id="ack-modal-title">Prise en charge de la demande</span>
            </div>
            <div class="modal-body">
                <div class="form-field">
                    <label id="ack-outcome-label">Résultat</label>
                    <div class="radio-choice">
                        <label id="ack-radio-resolved-label">
                            <input type="radio" name="ack-outcome" value="resolved" checked onchange="updateAckRadioStyle()">
                            <span id="ack-radio-resolved-text">Problème résolu</span>
                        </label>
                        <label id="ack-radio-ongoing-label">
                            <input type="radio" name="ack-outcome" value="ongoing" onchange="updateAckRadioStyle()">
                            <span id="ack-radio-ongoing-text">Pris en charge, reste actif</span>
                        </label>
                    </div>
                </div>
                <div class="form-field">
                    <label for="ack-notes" id="ack-notes-label">Notes (optionnel)</label>
                    <textarea id="ack-notes" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn secondary" id="ack-cancel-btn" onclick="closeAckModal()">Annuler</button>
                <button class="btn" id="ack-submit-btn" onclick="submitAckModal()">Valider</button>
            </div>
        </div>
    </div>

    <script src="{{ static_v('common.js') }}"></script>
    <script>
        const I18N = {
            fr: {
                pageTitle: "Historique des interventions Maintenance",
                loading: "Chargement de l'historique...",
                noInterventions: "<p>Aucune intervention demandée.</p>",
                requestedBy: "Demandé par",
                cellFilterLabel: "Cellule :",
                sinceFilterLabel: "Du :",
                untilFilterLabel: "Au :",
                allCells: "Toutes",
                resetFilters: "Réinitialiser",
                pendingToggleLabel: "Afficher aussi les demandes d'intervention en attente",
                pendingTitle: "Demandes en attente",
                pendingLoading: "Chargement...",
                noPending: "<p>Aucune demande en attente.</p>",
                genericPendingTitle: "Demandes génériques (sans défaut associé)",
                noGenericPending: "<p>Aucune demande générique en attente.</p>",
                ackButton: "Prise en charge",
                ackModalTitle: "Prise en charge de la demande",
                ackOutcomeLabel: "Résultat",
                ackResolved: "Problème résolu",
                ackOngoing: "Pris en charge, reste actif",
                ackNotesLabel: "Notes (optionnel)",
                ackCancel: "Annuler",
                ackSubmit: "Valider",
                ackSuccess: "Demande prise en charge.",
                ackError: "Erreur lors de la prise en charge.",
                requestMessage: "Message",
                historyTitle: "Interventions réalisées",
                historyTitleOperator: "Historique de mes demandes de maintenance",
                onDefaut: "sur le défaut",
                outcomeResolved: "résolu",
                outcomeOngoing: "reste actif",
                downloadBtn: "Télécharger CSV",
                csvTime: "Horodatage",
                csvCell: "Cellule",
                csvAction: "Action",
                csvAuthor: "Auteur",
                csvOutcome: "Résultat",
                csvOutcomeNone: "",
            },
            en: {
                pageTitle: "Maintenance Intervention History",
                loading: "Loading history...",
                noInterventions: "<p>No interventions requested.</p>",
                requestedBy: "Requested by",
                cellFilterLabel: "Cell:",
                sinceFilterLabel: "From:",
                untilFilterLabel: "To:",
                allCells: "All",
                resetFilters: "Reset",
                pendingToggleLabel: "Also show pending intervention requests",
                pendingTitle: "Pending requests",
                pendingLoading: "Loading...",
                noPending: "<p>No pending request.</p>",
                genericPendingTitle: "Generic requests (no associated fault)",
                noGenericPending: "<p>No pending generic request.</p>",
                ackButton: "Acknowledge",
                ackModalTitle: "Acknowledge request",
                ackOutcomeLabel: "Outcome",
                ackResolved: "Problem resolved",
                ackOngoing: "Taken care of, still active",
                ackNotesLabel: "Notes (optional)",
                ackCancel: "Cancel",
                ackSubmit: "Submit",
                ackSuccess: "Request acknowledged.",
                ackError: "Error while acknowledging the request.",
                requestMessage: "Message",
                historyTitle: "Completed interventions",
                historyTitleOperator: "History of my maintenance requests",
                onDefaut: "on fault",
                outcomeResolved: "resolved",
                outcomeOngoing: "still active",
                downloadBtn: "Download CSV",
                csvTime: "Timestamp",
                csvCell: "Cell",
                csvAction: "Action",
                csvAuthor: "Author",
                csvOutcome: "Outcome",
                csvOutcomeNone: "",
            },
        };

        const token = localStorage.getItem('jwt_token');
        const currentRole = localStorage.getItem('user_role');

        function t(key) {
            const lang = navLang();
            return (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
        }

        function applyLanguage() {
            document.title = t('pageTitle');
            document.getElementById('page-title').innerText = t('pageTitle');
            document.getElementById('loading-label').innerText = t('loading');
            document.getElementById('filter-cell-label').innerText = t('cellFilterLabel');
            document.getElementById('filter-since-label').innerText = t('sinceFilterLabel');
            document.getElementById('filter-until-label').innerText = t('untilFilterLabel');
            document.getElementById('filter-reset-btn').innerText = t('resetFilters');
            document.getElementById('download-csv-btn').innerText = t('downloadBtn');
            document.getElementById('cell-filter').options[0].innerText = t('allCells');
            document.getElementById('pending-toggle-label').innerText = t('pendingToggleLabel');
            document.getElementById('pending-title').innerText = t('pendingTitle');
            document.getElementById('pending-loading-label').innerText = t('pendingLoading');
            document.getElementById('generic-pending-title').innerText = t('genericPendingTitle');
            document.getElementById('generic-pending-loading-label').innerText = t('pendingLoading');
            document.getElementById('history-title').innerText = currentRole === 'OPERATEUR' ? t('historyTitleOperator') : t('historyTitle');
            document.getElementById('access-denied-title').innerText = navT('accessDeniedTitle');
            document.getElementById('access-denied-body').innerText = navT('accessDeniedBody');
            document.getElementById('access-denied-back').innerText = navT('accessDeniedBack');
            document.getElementById('ack-modal-title').innerText = t('ackModalTitle');
            document.getElementById('ack-outcome-label').innerText = t('ackOutcomeLabel');
            document.getElementById('ack-radio-resolved-text').innerText = t('ackResolved');
            document.getElementById('ack-radio-ongoing-text').innerText = t('ackOngoing');
            document.getElementById('ack-notes-label').innerText = t('ackNotesLabel');
            document.getElementById('ack-cancel-btn').innerText = t('ackCancel');
            document.getElementById('ack-submit-btn').innerText = t('ackSubmit');
            renderTopNav('maint-history', currentRole);
        }

        // Menu de filtre "joli" : nom de cellule affiché, pas seulement un
        // id — reconstruit depuis CELL_LIST (common.js::loadCellNames()),
        // plutôt que les 3 options figées d'origine, depuis que
        // l'Administrateur peut créer de nouvelles cellules (CHG-V2-088).
        function populateCellFilterOptions() {
            const select = document.getElementById('cell-filter');
            const current = select.value;
            select.innerHTML = `<option value="">${t('allCells')}</option>` +
                CELL_LIST.map((c) => `<option value="${c.id}">${cellDisplayName(c.id)}</option>`).join('');
            select.value = current;
        }

        function resetFilters() {
            document.getElementById('cell-filter').value = '';
            document.getElementById('since-filter').value = '';
            document.getElementById('until-filter').value = '';
            fetchAll();
        }

        function togglePendingVisibility() {
            const show = document.getElementById('pending-toggle').checked;
            document.getElementById('pending-block').classList.toggle('hidden', !show);
        }

        function buildQuery() {
            const params = new URLSearchParams();
            const cellId = document.getElementById('cell-filter').value;
            const since = document.getElementById('since-filter').value;
            const until = document.getElementById('until-filter').value;
            if (cellId) params.set('cell_id', cellId);
            if (since) params.set('since', `${since} 00:00:00`);
            if (until) params.set('until', `${until} 23:59:59`);
            return params;
        }

        // Étiquette de résultat affichée à côté d'une ligne d'historique.
        // ``item.defaut_id`` n'est renseigné que pour une intervention liée
        // à un défaut précis (page Historique des défauts) ; pour une
        // demande générique prise en charge (cf. acknowledgeGenericRequest),
        // il vaut null — dans ce cas on omet la mention "(sur le défaut
        // #...)"  plutôt que d'afficher "#null" (cf. CHG-V2-092/093, suivi
        // en_cours/résolu des demandes génériques).
        function outcomeTag(item) {
            if (item.probleme_resolu !== true && item.probleme_resolu !== false) {
                return '';
            }
            const cssClass = item.probleme_resolu ? 'resolved-tag' : 'status-en-cours-tag';
            const outcomeLabel = item.probleme_resolu ? t('outcomeResolved') : t('outcomeOngoing');
            const context = (item.defaut_id !== null && item.defaut_id !== undefined)
                ? `${t('onDefaut')} #${item.defaut_id} — `
                : '';
            return `<span class="${cssClass}">(${context}${outcomeLabel})</span>`;
        }

        // Dernier historique chargé (déjà filtré côté serveur selon les
        // filtres actifs), réutilisé par le téléchargement CSV sans refaire
        // d'appel réseau.
        let lastHistory = [];

        async function fetchHistory() {
            try {
                const response = await fetch(`/api/maintenance/history?${buildQuery().toString()}`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                const data = await response.json();
                if (data.status === 'ok') {
                    lastHistory = data.history;
                    const container = document.getElementById('history-content');
                    if (data.history.length === 0) {
                        container.innerHTML = t('noInterventions');
                    } else {
                        container.innerHTML = data.history.slice().reverse().map(h =>
                            `<div class="history-item"><div class="history-item-main"><strong>${h.time}</strong> — ${cellDisplayName(h.cell_id)} : ${h.action} <em>(${t('requestedBy')} ${h.user})</em> ${outcomeTag(h)}</div></div>`
                        ).join('');
                    }
                }
            } catch (e) { console.error(e); }
        }

        function outcomeCsvValue(item) {
            if (item.probleme_resolu === true) return t('outcomeResolved');
            if (item.probleme_resolu === false) return t('outcomeOngoing');
            return t('csvOutcomeNone');
        }

        // Téléchargement CSV de l'historique des interventions actuellement
        // affiché (respecte les filtres cellule/dates en cours), réservé à
        // la Maintenance/Admin comme les autres téléchargements du site.
        function downloadMaintenanceCsv() {
            const header = [t('csvTime'), t('csvCell'), t('csvAction'), t('csvAuthor'), t('csvOutcome')];
            const rows = lastHistory.slice().reverse().map((h) => [
                h.time,
                cellDisplayName(h.cell_id),
                h.action,
                h.user,
                outcomeCsvValue(h),
            ]);
            downloadCsv('historique_maintenance.csv', header, rows);
        }

        async function fetchPending() {
            try {
                const params = buildQuery();
                params.set('fault_status', 'actif');
                const response = await fetch(`/api/faults/history?${params.toString()}`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                const data = await response.json();
                if (data.status === 'ok') {
                    const container = document.getElementById('pending-content');
                    if (data.faults.length === 0) {
                        container.innerHTML = t('noPending');
                    } else {
                        container.innerHTML = data.faults.map(f =>
                            `<div class="history-item"><div class="history-item-main"><strong>${f.time}</strong> — ${cellDisplayName(f.cell_id)} — <span class="sev-${f.severity}">${translateFaultText(f.type)}</span><div style="color:#6E6E73;">${translateFaultText(f.description)}</div></div></div>`
                        ).join('');
                    }
                }
            } catch (e) { console.error(e); }
        }

        async function fetchGenericPending() {
            try {
                const response = await fetch('/api/status', {
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                const data = await response.json();
                if (data.status !== 'ok') return;
                const cellFilter = document.getElementById('cell-filter').value;
                const entries = Object.entries(data.maint_requests || {})
                    .filter(([cellId]) => !cellFilter || String(cellId) === String(cellFilter));
                const container = document.getElementById('generic-pending-content');
                if (entries.length === 0) {
                    container.innerHTML = t('noGenericPending');
                } else {
                    container.innerHTML = entries.map(([cellId, info]) => {
                        const username = (info && info.username) || info;
                        const message = info && info.message
                            ? `<div style="color:#6E6E73;">${t('requestMessage')} : ${info.message}</div>`
                            : '';
                        return `<div class="history-item"><div class="history-item-main">${cellDisplayName(cellId)} — <em>(${t('requestedBy')} ${username})</em>${message}</div><button class="btn btn-intervene" onclick="openAckPrompt(${cellId})">${t('ackButton')}</button></div>`;
                    }).join('');
                }
            } catch (e) { console.error(e); }
        }

        // Cellule ciblée par la popup de prise en charge actuellement ouverte
        // (null si aucune) — même pattern que interventionTargetDefautId
        // dans fault_history.html.
        let ackTargetCellId = null;

        function openAckPrompt(cellId) {
            ackTargetCellId = cellId;
            document.getElementById('ack-notes').value = '';
            document.querySelector('input[name="ack-outcome"][value="resolved"]').checked = true;
            updateAckRadioStyle();
            document.getElementById('ack-modal-overlay').classList.add('open');
        }

        function closeAckModal() {
            document.getElementById('ack-modal-overlay').classList.remove('open');
            ackTargetCellId = null;
        }

        function updateAckRadioStyle() {
            document.querySelectorAll('#ack-modal-overlay .radio-choice label').forEach((label) => {
                const input = label.querySelector('input[type="radio"]');
                label.classList.toggle('checked', input.checked);
            });
        }

        async function submitAckModal() {
            if (ackTargetCellId === null) return;
            const resolved = document.querySelector('input[name="ack-outcome"]:checked').value === 'resolved';
            const notes = document.getElementById('ack-notes').value;
            await acknowledgeGenericRequest(ackTargetCellId, resolved, notes);
        }

        // ``probleme_resolu`` est désormais obligatoire (cf. demande
        // utilisateur : "il faudrait que ce soit comme pour les défauts
        // avec (en cours, ou résolu)") : la Maintenance déclare si le
        // problème est résolu ou seulement pris en charge (reste actif),
        // via la popup ci-dessus — même principe que
        // submitIntervention() dans fault_history.html.
        async function acknowledgeGenericRequest(cellId, probleme_resolu, message) {
            try {
                const params = new URLSearchParams({ cell_id: cellId, probleme_resolu: probleme_resolu });
                if (message) params.set('message', message);
                const response = await fetch(`/api/maintenance/acknowledge-request?${params.toString()}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                if (response.ok) {
                    closeAckModal();
                    showModal(t('ackSuccess'), 'success');
                    fetchAll();
                } else {
                    showModal(t('ackError'), 'error');
                }
            } catch (e) { console.error(e); }
        }

        function fetchAll() {
            fetchHistory();
            if (hasMaintenanceRights(currentRole)) {
                fetchPending();
                fetchGenericPending();
            }
        }

        async function init() {
            if (!token) {
                window.location.href = '/';
            } else if (!hasPageAccess(currentRole)) {
                applyLanguage();
                document.getElementById('access-denied').classList.remove('hidden');
            } else {
                await loadCellNames();
                populateCellFilterOptions();
                applyLanguage();
                // Le panneau "Demandes en attente" (défauts actifs + demandes
                // génériques, avec actions "Intervenir"/"Prise en charge") est un
                // outil de travail Maintenance ; l'Opérateur ne voit que
                // l'historique de SES propres demandes (déjà filtré côté serveur,
                // cf. CHG-V2-066), sans ce panneau.
                if (currentRole === 'OPERATEUR') {
                    document.getElementById('pending-panel').classList.add('hidden');
                }
                // Téléchargement réservé à la Maintenance/Admin, comme les
                // autres exports du site (cf. data_comparison.html).
                if (hasMaintenanceRights(currentRole)) {
                    document.getElementById('download-csv-btn').classList.remove('hidden');
                }
                document.getElementById('page-content').classList.remove('hidden');
                fetchAll();
                setInterval(fetchAll, 5000);
            }
        }

        init();
    </script>
</body>
</html>
